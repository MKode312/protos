syntax = "proto3";

package auth;

option go_package = "mkode.sso.v1;ssov1";

service Auth {
    rpc Register (RegisterRequest) returns (RegisterResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
    rpc RegisterAsAdmin(RegisterAsAdminRequest) returns (RegisterAsAdminResponse);
    rpc IsAdmin(IsAdminRequest) returns (IsAdminResponse);
}

message RegisterRequest {
    string email = 1;
    string password = 2;
}

message RegisterResponse {
    int64 user_id = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
}

message RegisterAsAdminRequest {
    string email = 1;
    string password = 2;
    string admin_secret = 3;
}

message RegisterAsAdminResponse {
    int64 user_id = 1;
}

message IsAdminRequest {
    int64 user_id = 1;
}

message IsAdminResponse {
    bool is_admin = 1;
}