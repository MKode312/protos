syntax = "proto3";

package payments.v1;

option go_package = "github.com/MKode312/protos/gen/go/payments;paymentsv1";

service Payment {
  rpc AddCard(AddCardRequest) returns (AddCardResponse) {}
  rpc AddFunds(AddFundsRequest) returns (AddFundsResponse) {}
  rpc Pay(PayRequest) returns (PayResponse) {}
  rpc GetCard(GetCardRequest) returns (GetCardResponse) {}
}

message AddCardRequest {
  string email = 1;
  string card_number = 2;
  string cvc = 3;
  string phone_number = 4;
}

message AddCardResponse {
  bool success = 1;
}

message AddFundsRequest {
  string email = 1;
  int64 amount = 2;
}

message AddFundsResponse {
  int64 balance = 1;
  bool success = 2;
}

message PayRequest {
  string email = 1;
  int64 amount = 2;
}

message PayResponse {
  int64 balance = 1;
  bool success = 2;
}

message GetCardRequest {
  string email = 1;
}

message GetCardResponse {
  string card_number = 1;
  string phone_number = 2;
  bool success = 3;
}